<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Đăng nhập</title>
</head>
<body>

<h2>Đăng nhập sinh viên</h2>

<p th:text="${error}"></p>

<form method="post">

    <div>
        MSSV:
        <input type="text" name="mssv">
    </div>

    <br>

    <div>
        Password:
        <input type="password" name="password">
    </div>

    <br>

    <button type="submit">
        Đăng nhập
    </button>

</form>

</body>
</html>
